[project]
name = "ct-agent"
version = "0.1.0"
description = "CT Agent: Robinhood Chain research and paper-trading persona backed by Muse Spark"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "eth-abi>=5",
  "eth-utils>=4",
  "eth-account>=0.13",
  "openai>=1.50",
  "feedparser>=6",
  "pillow>=10",
  "pycryptodome>=3.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctagent = "ct_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ct_agent*"]

[tool.setuptools.package-data]
ct_agent = ["schema.sql", "social/media/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
