[project]
name = "ct-agent"
version = "0.1.0"
description = "VIGIL: Robinhood Chain research and trading persona, powered by Grok (xAI API)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.50",
  "feedparser>=6",
  "pillow>=10",
  "pycryptodome>=3.15",
  "solders>=0.29",
  "base58>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctagent = "ct_agent.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ct_agent*"]

[tool.setuptools.package-data]
ct_agent = ["schema.sql", "social/media/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
