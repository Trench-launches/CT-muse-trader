# Secret scanning for this repo: gitleaks' built-in rules plus the credentials this project uses.
# Runs in CI on every push and pull request (.github/workflows/ci.yml) and before each commit (.pre-commit-config.yaml).
title = "ct-agent gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "eth-private-key"
description = "An Ethereum private key (64 hex characters) assigned to a key setting"
regex = '''(?i)(private_?key|wallet_?key|_pk)\s*[=:]\s*["']?(0x)?([0-9a-f]{64})\b'''
secretGroup = 3
keywords = ["private_key", "privatekey", "wallet_key", "walletkey", "_pk"]

[[rules]]
id = "xai-api-key"
description = "xAI (Grok) API key"
regex = '''\bxai-[A-Za-z0-9]{40,}\b'''
keywords = ["xai-"]

[[rules]]
id = "alchemy-rpc-key"
description = "An RPC provider key inside a URL"
regex = '''https://[a-z0-9.-]+\.(?:alchemy\.com|infura\.io|quiknode\.pro|ankr\.com)/(?:v2/|v3/)?([A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["alchemy.com", "infura.io", "quiknode.pro", "ankr.com"]

[[rules]]
id = "supabase-secret-key"
description = "Supabase service-role / secret key"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "bare-uuid-token"
description = "A bare UUID on its own line, the shape of a Railway token pasted into a file by mistake"
regex = '''(?m)^\s*([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\s*$'''
secretGroup = 1

[[rules]]
id = "railway-token-assignment"
description = "A Railway API or project token assigned to a variable"
regex = '''(?i)railway_?(api_)?token\s*[=:]\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'''
secretGroup = 2
keywords = ["railway"]

[allowlist]
description = "Generated or binary files"
paths = [
  '''(^|/)web/assets/''',
  '''(^|/)brand/''',
  '''\.(png|webp|ico|jpg|jpeg|gif)$''',
]
