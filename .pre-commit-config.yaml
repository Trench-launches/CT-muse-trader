# Checks that run before every commit. Set up once per clone:
#   pip install pre-commit && pre-commit install
# Run on everything with: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks  # uses .gitleaks.toml and .gitleaksignore
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: no-env-files
        name: never commit .env files (only .env.example)
        entry: "env files hold secrets: keep them out of git (only .env.example belongs in the repo)"
        language: fail
        files: '(^|/)\.env($|\.(?!example$))'
