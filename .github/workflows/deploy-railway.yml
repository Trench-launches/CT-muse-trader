# Deploys the backend to Railway on every push to main that touches backend files. Tests must pass first.
# Setup (repo Settings -> Secrets and variables -> Actions):
#   secret   RAILWAY_TOKEN    a Railway *project* token for the project you deploy to (not an account token)
#   variable RAILWAY_SERVICE  the Railway service name; deploys are skipped while it is unset (so forks don't try)
# The upstream repo falls back to its own service, "vigil", until RAILWAY_SERVICE is set there.
name: Deploy backend to Railway

on:
  push:
    branches: [main]
    paths:
      - "ct_agent/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "railway.json"
      - ".railwayignore"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    if: vars.RAILWAY_SERVICE != '' || github.repository == 'Trench-launches/CT-muse-trader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Railway CLI (retried, the release download sometimes drops)"
        run: |
          for i in 1 2 3 4; do npm install -g @railway/cli && exit 0; echo "retry $i"; sleep $((i * 10)); done
          exit 1
      - name: Deploy to Railway
        run: railway up --service "$SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE || 'vigil' }}
