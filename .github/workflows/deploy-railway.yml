# Deploys the MOOSE backend to Railway (project "moose", service "moose") on
# every push to main that touches backend files. Tests must pass first.
# Uses a Railway project token stored as the RAILWAY_TOKEN repository secret.
name: Deploy backend to Railway

on:
  push:
    branches: [main]
    paths:
      - "ct_agent/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "railway.json"
      - ".railwayignore"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI (retries: the release download sometimes drops)
        run: |
          for i in 1 2 3 4; do npm install -g @railway/cli && exit 0; echo "retry $i"; sleep $((i * 10)); done
          exit 1
      - name: Deploy to Railway
        run: railway up --service moose --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
